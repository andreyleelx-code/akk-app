<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="АКК">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="https://i.ibb.co/QjNFzSmX/logo-AKK-enhanced-2-page-0001.jpg">
<link rel="apple-touch-icon" href="https://i.ibb.co/QjNFzSmX/logo-AKK-enhanced-2-page-0001.jpg">
<title>АКК — интерактивный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a4a;
    --navy-2:#173a5e;
    --coral:#e8623f;
    --coral-dark:#c94f30;
    --gold:#c9972f;
    --sage:#5f8f6a;
    --cream:#faf6f0;
    --paper:#fffdfa;
    --line:#ece3d6;
    --ink:#2a2621;
    --ink-soft:#75695c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans',Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  h1,h2,.disp{font-family:'Manrope',sans-serif;}

  /* ---------- demo page chrome ---------- */
  header.demo-header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff; padding:28px 24px; text-align:center;
  }
  header.demo-header h1{margin:0 0 6px;font-size:20px;font-weight:800;}
  header.demo-header p{margin:0;color:#cfe0ee;font-size:13px;}
  .stage{display:flex;justify-content:center;padding:34px 20px 60px;}

  /* ---------- phone frame (from mockups.html, reused as-is) ---------- */
  .phone{
    width:300px;height:640px;background:#111;border-radius:38px;padding:10px;
    box-shadow:0 18px 40px rgba(15,42,74,.18), 0 2px 6px rgba(15,42,74,.10);
    position:relative;
  }
  .screen{
    width:100%;height:100%;background:var(--cream);border-radius:28px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:120px;height:22px;background:#111;border-radius:0 0 14px 14px;z-index:5;
  }
  .status{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 4px;font-size:11px;font-weight:700;color:var(--navy);}
  .screen-body{flex:1;overflow:hidden;padding:0 14px 8px;}
  .screen-body.scroll{overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .screen-body.scroll::-webkit-scrollbar{display:none;width:0;height:0;}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 8px;}
  .appbar .logo{display:flex;align-items:center;gap:8px;}
  .logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--coral),var(--gold));flex-shrink:0;}
  .appbar .name{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--navy);}
  .icon-btn{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;}
  .notif-badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:50%;background:var(--coral);color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 2px;border:1.5px solid var(--cream);}
  .notif-row{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .notif-row:last-child{border-bottom:none;}
  .notif-row .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notif-row .tx{flex:1;min-width:0;}
  .notif-row .tx .t{font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.35;}
  .notif-row .tx .s{font-size:9.5px;color:var(--ink-soft);margin-top:3px;}
  .notif-row.read .tx .t{font-weight:600;color:var(--ink-soft);}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--coral);flex-shrink:0;margin-top:6px;}
  .vol-hero{border-radius:16px;padding:14px;color:#fff;margin-bottom:12px;background:linear-gradient(135deg,var(--sage) 0%,#3f7a5e 100%);}
  .vol-hero .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:13.5px;line-height:1.35;}
  .vol-hero .s{font-size:9.5px;color:#e3f0e7;margin-top:5px;line-height:1.4;}
  .vol-progress{background:rgba(255,255,255,.2);border-radius:6px;height:6px;margin-top:10px;overflow:hidden;}
  .vol-progress i{display:block;height:100%;background:#fff;}
  .vol-steps{display:flex;flex-direction:column;gap:8px;}
  .vol-step{display:flex;align-items:center;gap:10px;}
  .vol-step .num{width:22px;height:22px;border-radius:50%;background:var(--cream);color:var(--navy);font-family:'Manrope',sans-serif;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vol-step .s{font-size:10.5px;color:var(--ink);}
  .icon{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .icon.coral{stroke:var(--coral);}
  .icon.white{stroke:#fff;}

  /* bottom nav */
  .tabbar{
    display:flex;justify-content:space-around;align-items:center;
    background:#fff;border-top:1px solid var(--line);
    padding:9px 6px calc(9px + 8px);
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;}
  .tab span{font-size:9.5px;color:var(--ink-soft);font-weight:600;}
  .tab.active span{color:var(--coral);}
  .tab .icon{stroke:var(--ink-soft);}
  .tab.active .icon{stroke:var(--coral);}

  /* cards / chips generic */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(15,42,74,.05);}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:10.5px;font-weight:600;color:var(--navy);}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--cream);color:var(--navy);}
  .tag.coral{background:#fdece6;color:var(--coral-dark);}
  .tag.gold{background:#faf1de;color:#8a6a1c;}
  .btn{background:var(--coral);color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:11.5px;border:none;border-radius:10px;padding:8px 0;text-align:center;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.4px solid var(--navy);}
  .grad-ph{border-radius:10px;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);}

  /* HOME screen specifics */
  .banner-carousel{margin-bottom:12px;}
  .banner-slide{height:70px;border-radius:14px;background:linear-gradient(135deg,#2a4a6e,#3f7a9e);display:flex;align-items:center;padding:0 14px;color:#fff;position:relative;overflow:hidden;}
  .banner-slide .adbadge{position:absolute;top:7px;right:9px;background:rgba(255,255,255,.22);font-size:7px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:5px;}
  .banner-slide .bt{font-family:'Manrope',sans-serif;font-weight:800;font-size:11.5px;}
  .banner-slide .bs{font-size:8.5px;color:#dbe9f5;margin-top:2px;}
  .banner-dots{display:flex;justify-content:center;gap:4px;margin-top:7px;}
  .banner-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block;}
  .banner-dots i.on{background:var(--coral);width:14px;border-radius:3px;}

  .kpark-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:16px;padding:14px;color:#fff;margin-bottom:12px;}
  .kpark-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .kpark-card .top .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;}
  .kpark-card .top .s{font-size:10px;color:#c9d8ea;margin-top:2px;}
  .ring{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--coral) 0% 68%, rgba(255,255,255,.18) 68% 100%);display:flex;align-items:center;justify-content:center;}
  .ring .in{width:34px;height:34px;border-radius:50%;background:var(--navy-2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
  .kpark-card .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.16);margin-top:12px;overflow:hidden;}
  .kpark-card .bar i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--coral),var(--gold));}
  .kpark-card .foot{display:flex;justify-content:space-between;font-size:9.5px;color:#dbe6f1;margin-top:8px;}

  .bday-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
  .bday-avatars{display:flex;flex-shrink:0;}
  .bday-avatars i{width:32px;height:32px;border-radius:50%;border:2px solid #fff;margin-left:-10px;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);box-shadow:0 1px 3px rgba(15,42,74,.1);}
  .bday-avatars i:first-child{margin-left:0;}
  .bday-text{flex:1;min-width:0;}
  .bday-text .t{font-size:10.5px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bday-text .s{font-size:8.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bday-btn{background:var(--coral);color:#fff;font-size:8.5px;font-weight:700;border:none;border-radius:8px;padding:7px 8px;white-space:nowrap;flex-shrink:0;}
  .news-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .news-item:last-child{border-bottom:none;}
  .news-item .ph{width:56px;height:56px;flex-shrink:0;}
  .news-item .title{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;}
  .news-item .meta{font-size:10px;color:var(--ink-soft);margin-top:4px;display:flex;gap:6px;align-items:center;}

  .hero-card{position:relative;height:112px;border-radius:16px;overflow:hidden;margin-bottom:10px;
    background:linear-gradient(135deg,#d8c3a5,#eb9b6f);}
  .hero-card .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,74,0) 30%,rgba(15,42,74,.88) 100%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;}
  .hero-card .htag{align-self:flex-start;background:var(--coral);color:#fff;font-size:8.5px;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:6px;}
  .hero-card .hh{color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;line-height:1.25;}
  .hero-card .hm{color:#e8e0d5;font-size:9px;margin-top:4px;}

  .sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px;}
  .sec-head .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;}
  .sec-head .l{font-size:9.5px;color:var(--coral-dark);font-weight:700;}

  .appeal-card{display:flex;align-items:center;gap:10px;background:#fff;border:1.4px dashed var(--navy);border-radius:14px;padding:10px 12px;margin-bottom:4px;}
  .appeal-card .ic{width:32px;height:32px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .appeal-card .tx{flex:1;}
  .appeal-card .tx .t{font-size:11px;font-weight:700;color:var(--navy);}
  .appeal-card .tx .s{font-size:8.5px;color:var(--ink-soft);margin-top:1px;}
  .appeal-card .go{font-size:9.5px;font-weight:700;color:var(--coral-dark);flex-shrink:0;}

  .award-row{display:flex;align-items:center;gap:8px;padding-top:8px;margin-top:8px;border-top:1px solid var(--line);}
  .award-row .ic{width:24px;height:24px;border-radius:7px;background:#faf1de;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .award-row .t{font-size:10px;color:var(--ink);}

  .ev-mini-row{display:flex;gap:8px;}
  .ev-mini{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0;}
  .ev-mini .d{font-family:'Manrope',sans-serif;font-weight:800;color:var(--coral-dark);font-size:13px;}
  .ev-mini .t{font-size:9px;font-weight:700;margin-top:3px;line-height:1.25;color:var(--ink);}
  .ev-mini .l{font-size:8px;color:var(--ink-soft);margin-top:3px;}

  .kpark-mini{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    border-radius:14px;padding:9px 12px;color:#fff;}
  .kpark-mini .ring{width:34px;height:34px;flex-shrink:0;}
  .kpark-mini .ring .in{width:26px;height:26px;font-size:8px;}
  .kpark-mini .tx{flex:1;}
  .kpark-mini .tx .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;}
  .kpark-mini .tx .s{font-size:8.5px;color:#c9d8ea;margin-top:1px;}

  /* EVENTS screen */
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:10px;}
  .seg div{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 0;border-radius:8px;color:var(--ink-soft);}
  .seg div.on{background:var(--navy);color:#fff;}
  .filters{display:flex;gap:6px;margin-bottom:10px;overflow:hidden;}
  .event-card{margin-bottom:10px;}
  .event-card .row{display:flex;gap:10px;}
  .date-badge{width:44px;height:48px;border-radius:10px;background:var(--cream);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .date-badge .d{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;color:var(--coral-dark);line-height:1;}
  .date-badge .m{font-size:8.5px;color:var(--ink-soft);text-transform:uppercase;}
  .ev-title{font-size:12px;font-weight:700;}
  .ev-loc{font-size:10px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:4px;}
  .avatars{display:flex;margin-top:8px;}
  .avatars i{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);border:2px solid #fff;margin-left:-6px;}
  .avatars i:first-child{margin-left:0;}
  .mini-btn{margin-top:9px;align-self:flex-start;}

  /* DIRECTIONS screen */
  .dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .dir-card{padding:8px;}
  .dir-ic{width:32px;height:32px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:6px;flex-shrink:0;}
  .dir-ic img{display:block;}
  .dir-ic.wide{width:56px;}
  .dir-card .n{font-size:11px;font-weight:700;line-height:1.25;}
  .dir-card .c{font-size:9px;color:var(--ink-soft);margin-top:3px;}
  .search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin-bottom:8px;}
  .search-bar span{font-size:11px;color:var(--ink-soft);}

  /* PROFILE screen */
  .profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 14px;}
  .avatar-lg{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);border:3px solid #fff;box-shadow:0 2px 8px rgba(15,42,74,.12);margin-bottom:8px;}
  .profile-head .nm{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--navy);}
  .profile-head .pos{font-size:10.5px;color:var(--coral-dark);font-weight:700;margin-top:2px;}
  .id-card{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:14px;padding:12px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .id-card .l div:first-child{font-size:9px;color:#cfe0ee;}
  .id-card .l div:last-child{font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;margin-top:2px;}
  .qr{width:40px;height:40px;border-radius:8px;background:#fff;
      background-image: repeating-linear-gradient(0deg,#0f2a4a 0 3px, transparent 3px 6px), repeating-linear-gradient(90deg,#0f2a4a 0 3px, transparent 3px 6px);
      background-blend-mode:multiply; }
  .org-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  .org-node{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-size:9.5px;font-weight:700;color:var(--navy);line-height:1.25;}
  .org-node.on{border-color:var(--coral);background:#fef6f3;color:var(--coral-dark);}
  .roster-item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .roster-item:last-child{border-bottom:none;}
  .roster-ph{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:repeating-linear-gradient(45deg,#ece3d6,#ece3d6 4px,#f6f0e6 4px,#f6f0e6 8px);}
  .roster-item .t{font-size:11px;font-weight:700;color:var(--ink-soft);font-style:italic;}
  .roster-item .s{font-size:9px;color:var(--ink-soft);margin-top:1px;}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item .l{display:flex;align-items:center;gap:10px;}
  .list-ic{width:30px;height:30px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;}
  .list-item .t{font-size:11.5px;font-weight:700;}
  .list-item .s{font-size:9.5px;color:var(--ink-soft);}

  .toptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .toptabs div{font-size:11.5px;font-weight:700;color:var(--ink-soft);padding-bottom:8px;}
  .toptabs div.on{color:var(--navy);border-bottom:2px solid var(--coral);}

  .logo-ph{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:repeating-linear-gradient(45deg,#ece3d6,#ece3d6 4px,#f6f0e6 4px,#f6f0e6 8px);}

  .leader-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;}
  .leader-card .roster-ph{width:44px;height:44px;}
  .leader-card .t{font-size:12px;font-weight:700;color:var(--navy);}
  .leader-card .s{font-size:9.5px;color:var(--ink-soft);margin-top:2px;}

  .info-row{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .info-row:last-child{border-bottom:none;}
  .info-row .ic{width:26px;height:26px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .info-row .tx .t{font-size:9px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;}
  .info-row .tx .s{font-size:11px;color:var(--ink);margin-top:2px;line-height:1.4;}

  .icon-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .icon-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;}
  .icon-tile .ic{width:26px;height:26px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 5px;}
  .icon-tile .n{font-size:8px;font-weight:700;color:var(--ink);line-height:1.2;}

  .zone-list div{font-size:10px;color:var(--ink);padding:5px 2px;border-bottom:1px solid var(--line);}
  .zone-list div:last-child{border-bottom:none;}

  .build-carousel{display:flex;gap:8px;overflow:hidden;}
  .build-card{width:92px;flex-shrink:0;}
  .build-card .ph{height:62px;border-radius:12px;position:relative;background:linear-gradient(135deg,#2a4a6e,#3f7a9e);}
  .build-card .ph .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .build-card .play i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;}
  .build-card .cap{font-size:8.5px;color:var(--ink-soft);margin-top:5px;text-align:center;}
  .map-card{height:72px;border-radius:14px;background:linear-gradient(160deg,#eef2ec,#e4ece6);border:1px solid var(--line);position:relative;}
  .map-card .lbl{position:absolute;left:10px;bottom:8px;background:#fff;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;color:var(--navy);}
  .stat-row{display:flex;gap:8px;}
  .stat{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;}
  .stat b{display:block;font-family:'Manrope',sans-serif;font-size:14px;color:var(--navy);}
  .stat span{font-size:8.5px;color:var(--ink-soft);}

  .discount-card{text-align:center;padding:14px 8px;}
  .discount-card .pct{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;color:var(--coral-dark);}
  .discount-card .n{font-size:9.5px;font-weight:700;margin-top:4px;}

  .issue-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;}
  .issue-card .cov{width:34px;height:46px;border-radius:5px;flex-shrink:0;background:linear-gradient(135deg,#0f2a4a,#173a5e);}
  .issue-card .tx{flex:1;}
  .issue-card .tx .t{font-size:11px;font-weight:700;color:var(--navy);}
  .issue-card .tx .s{font-size:9px;color:var(--ink-soft);margin-top:2px;}

  .show-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;}
  .show-row:last-child{border-bottom:none;}
  .show-row .ph{width:50px;height:64px;border-radius:10px;flex-shrink:0;}
  .show-row .tx{flex:1;min-width:0;}
  .show-row .tx .t{font-size:11.5px;font-weight:700;line-height:1.25;}
  .show-row .tx .s{font-size:9.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- interactivity ---------- */
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}
  [data-goto],[data-tab-group]{cursor:pointer;user-select:none;transition:transform .12s ease, box-shadow .12s ease;}
  [data-goto]:active,[data-tab-group]:active{transform:scale(.97);}
  .card[data-goto]:hover,.dir-card:hover{box-shadow:0 4px 14px rgba(15,42,74,.14);}
  .tab:hover .icon{stroke:var(--coral-dark);}
  .icon-btn[data-goto]:hover{border-color:var(--coral);}

  /* ---------- filters button + badge ---------- */
  .filters-btn{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;position:relative;}
  .filters-btn span{font-size:10px;font-weight:700;color:var(--navy);}
  .filters-badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:50%;background:var(--coral);color:#fff;font-size:8.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 2px;}

  /* ---------- filter overlay panel ---------- */
  .filter-overlay{position:absolute;inset:0;background:rgba(15,42,74,.42);z-index:20;}
  .filter-overlay .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + 8px);max-height:78%;overflow-y:auto;}
  .filter-overlay .fh{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--navy);margin-bottom:10px;}
  .filter-overlay .fgroup-t{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;margin:10px 0 6px;}
  .filter-overlay label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink);padding:4px 0;}
  .filter-overlay .frow{display:flex;gap:8px;}
  .filter-overlay .frow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:10.5px;font-family:inherit;}
  .filter-overlay .factions{display:flex;gap:8px;margin-top:14px;}
  .filter-overlay .factions button{flex:1;}

  /* ---------- bookmark button on event cards ---------- */
  .bookmark-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2;}
  .bookmark-btn svg{width:12px;height:12px;stroke:var(--navy);fill:none;stroke-width:2;}
  .bookmark-btn.bookmarked svg{fill:var(--coral);stroke:var(--coral);}
  .event-card .row{position:relative;}

  /* ---------- events calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-head .arrow{width:26px;height:26px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .cal-head .m{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--navy);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:8.5px;color:var(--ink-soft);text-align:center;font-weight:700;padding-bottom:4px;}
  .cal-cell{position:relative;height:32px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink);}
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell.has-events{border-color:var(--coral);color:var(--navy);font-weight:700;}
  .cal-cell.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .cal-count{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--coral);color:#fff;font-size:7.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .cal-day-events{margin-top:12px;display:none;}
  .cal-day-events.active{display:block;}

  /* ---------- announcement list rows ---------- */
  .announce-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;}
  .announce-row:last-child{border-bottom:none;}
  .announce-row .ph{width:56px;height:56px;border-radius:10px;flex-shrink:0;}
  .announce-row .tx{flex:1;min-width:0;}
  .announce-row .tx .n{font-size:11.5px;font-weight:700;line-height:1.3;}
  .announce-row .tx .price{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;color:var(--coral-dark);margin-top:3px;}
  .announce-row .tx .c{font-size:9.5px;color:var(--ink-soft);}

  /* ---------- MDK opportunities / rating / achievements ---------- */
  .opp-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px;}
  .opp-card .t{font-size:12px;font-weight:700;color:var(--navy);}
  .opp-card .s{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
  .opp-card .deadline{font-size:9px;color:var(--coral-dark);font-weight:700;margin-top:6px;}
  .opp-card button{margin-top:9px;width:100%;}
  .rating-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .rating-row:last-child{border-bottom:none;}
  .rating-row.me{background:#fef6f3;border-radius:10px;padding:8px;margin:2px 0;border-bottom:none;}
  .rating-row .place{width:22px;text-align:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0;}
  .rating-row .tx{flex:1;}
  .rating-row .tx .t{font-size:11px;font-weight:700;}
  .rating-row .tx .s{font-size:9px;color:var(--ink-soft);}
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .badge-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;}
  .badge-tile.locked{opacity:.4;}
  .badge-tile .ic{width:34px;height:34px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
  .badge-tile .n{font-size:8.5px;font-weight:700;line-height:1.25;}
  .badge-tile .d{font-size:7.5px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- event detail state (free / paid / info) ---------- */
  [data-event-type="free"] .buy-ticket-block{display:none;}
  [data-event-type="paid"] .register-btn{display:none;}
  [data-event-type="info"] .register-btn,[data-event-type="info"] .buy-ticket-block{display:none;}

  /* ---------- install buttons ---------- */
  .install-panel{
    max-width:760px; margin:0 auto 18px; padding:16px 18px;
    background:#fffdfa; border:1px solid var(--line); border-radius:18px;
    box-shadow:0 8px 24px rgba(15,42,74,.08); text-align:center;
  }
  .install-panel h2{margin:0 0 6px; font-size:18px; color:var(--navy);}
  .install-panel p{margin:0 0 12px; font-size:13px; color:var(--ink-soft);}
  .install-buttons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .install-btn{
    border:0; border-radius:12px; padding:12px 16px; cursor:pointer;
    font:700 13px/1.1 Manrope,Arial,sans-serif; color:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.12); transition:transform .15s ease,opacity .15s ease;
  }
  .install-btn:hover{transform:translateY(-1px);}
  .install-btn:active{transform:translateY(0);}
  .install-btn.android{background:#1f8f4d;}
  .install-btn.ios{background:var(--navy);}
  .install-modal{
    position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center;
    padding:20px; background:rgba(10,20,30,.55);
  }
  .install-modal.show{display:flex;}
  .install-dialog{
    width:min(430px,100%); background:#fffdfa; border-radius:20px; padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25); text-align:left;
  }
  .install-dialog h3{margin:0 0 8px; color:var(--navy); font-size:20px;}
  .install-dialog p{margin:0 0 10px; color:var(--ink-soft); font-size:14px; line-height:1.5;}
  .install-dialog ol{margin:10px 0 16px; padding-left:22px; color:var(--ink); font-size:14px; line-height:1.6;}
  .install-close{width:100%; border:1px solid var(--line); background:#fff; border-radius:12px; padding:11px 14px; cursor:pointer; font-weight:700;}
  @media (max-width:600px){
    .install-panel{margin:0 12px 14px; padding:14px;}
    .install-btn{flex:1 1 100%;}
  }

  /* ---------- real installed PWA: use the whole device screen ---------- */
  @media (display-mode: standalone), (display-mode: fullscreen){
    html, body{
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:var(--cream);
    }
    header.demo-header,
    .install-panel{
      display:none !important;
    }
    .stage{
      width:100vw;
      height:100dvh;
      min-height:100dvh;
      padding:0;
      margin:0;
      display:block;
    }
    .phone{
      width:100vw;
      height:100dvh;
      min-height:100dvh;
      padding:0;
      margin:0;
      border-radius:0;
      background:var(--cream);
      box-shadow:none;
    }
    .screen{
      width:100%;
      height:100%;
      min-height:100%;
      border-radius:0;
      overflow:hidden;
    }
    .notch{
      display:none;
    }
    .status{
      display:none;
    }
    .screen-body{
      height:100%;
      min-height:0;
      padding-top:calc(env(safe-area-inset-top) + 10px);
      padding-left:14px;
      padding-right:14px;
      padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
    }
  }


  html.is-installed-pwa .install-panel,
  html.is-installed-pwa .install-modal {
    display: none !important;
  }
</style>
</head>
<body>

<header class="demo-header">
  <h1>АКК — интерактивный прототип</h1>
  <p>Кликайте по элементам интерфейса — иконки, карточки и вкладки переключают экраны.</p>
</header>

<script>
(function(){
  var standalone = false;
  try { standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches; } catch(e) {}
  standalone = standalone || window.navigator.standalone === true;
  if (standalone) {
    document.documentElement.classList.add('is-installed-pwa');
  }
})();
</script>

<section class="install-panel" aria-label="Установка приложения">
  <h2>Установить приложение</h2>
  <p>Выберите устройство — откроется правильный способ установки.</p>
  <div class="install-buttons">
    <button class="install-btn android" id="install-android" type="button">📱 Установить на Android</button>
    <button class="install-btn ios" id="install-ios" type="button">🍎 Установить на iPhone</button>
  </div>
</section>

<div class="stage">
  <div class="phone"><div class="screen" id="screen-root"></div></div>
</div>

<script>
(function(){
  var root = document.getElementById('screen-root');
  var history = ['home'];

  function render(id){
    var tpl = document.getElementById('tpl-' + id);
    if(!tpl){ console.error('Unknown screen id:', id); return; }
    root.innerHTML = tpl.innerHTML;
  }

  function goTo(id){
    history.push(id);
    render(id);
  }

  function goBack(){
    if(history.length > 1){
      history.pop();
      render(history[history.length - 1]);
    } else {
      history = ['home'];
      render('home');
    }
  }

  function handleTab(el){
    var group = el.getAttribute('data-tab-group');
    var value = el.getAttribute('data-tab-value');
    if(!group || !value) return;

    var buttons = root.querySelectorAll('[data-tab-group="' + group + '"][data-tab-value]');
    buttons.forEach(function(btn){
      btn.classList.remove('on', 'active');
    });
    el.classList.add('on');

    var panels = root.querySelectorAll('[data-tab-group="' + group + '"][data-tabpanel]');
    if(panels.length){
      panels.forEach(function(panel){
        panel.classList.toggle('active', panel.getAttribute('data-tabpanel') === value);
      });
    }
  }

  root.addEventListener('click', function(e){
    var gotoEl = e.target.closest('[data-goto]');
    if(gotoEl){
      var target = gotoEl.getAttribute('data-goto');
      var filterType = gotoEl.getAttribute('data-filter-type');
      if(target === '__back__'){
        goBack();
      } else {
        goTo(target);
        if(filterType){
          var tabBtn = root.querySelector('[data-tab-group="mdk-opp"][data-tab-value="' + filterType + '"]');
          if(tabBtn) handleTab(tabBtn);
        }
      }
      return;
    }
    var tabEl = e.target.closest('[data-tab-group]');
    if(tabEl){
      handleTab(tabEl);
    }
  });

  render('home');
})();
</script>

    <h3 id="install-modal-title">Установка приложения</h3>
    <p id="install-modal-text"></p>

<script>
/* ---------- PWA service worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function (err) {
      console.error('Service worker registration failed:', err);
    });
  });
}

/* ---------- visible Android / iPhone install buttons ---------- */
(function(){
  var deferredPrompt = null;
  var modal = document.getElementById('install-modal');
  var text = document.getElementById('install-modal-text');
  var steps = document.getElementById('install-modal-steps');
  var androidBtn = document.getElementById('install-android');
  var iosBtn = document.getElementById('install-ios');
  var closeBtn = document.getElementById('install-close');

  function showModal(title, body, list){
    document.getElementById('install-modal-title').textContent = title;
    text.textContent = body;
    steps.innerHTML = '';
    (list || []).forEach(function(item){
      var li = document.createElement('li');
      li.textContent = item;
      steps.appendChild(li);
    });
    modal.classList.add('show');
  }

  function closeModal(){ modal.classList.remove('show'); }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
  });

  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
  });

  androidBtn.addEventListener('click', async function(){
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch(e) {}
      deferredPrompt = null;
      return;
    }

    showModal(
      'Установка на Android',
      'В Chrome кнопка установки может не показываться автоматически. Установите приложение через меню браузера:',
      [
        'Откройте это приложение в Google Chrome.',
        'Нажмите ⋮ в правом верхнем углу.',
        'Выберите «Установить приложение» или «Добавить на главный экран».',
        'Подтвердите установку.'
      ]
    );
  });

  iosBtn.addEventListener('click', function(){
    showModal(
      'Установка на iPhone',
      'На iPhone установка выполняется через Safari. В самом приложении Apple не показывает отдельную кнопку установки автоматически.',
      [
        'Откройте эту страницу именно в Safari.',
        'Нажмите кнопку «Поделиться» (квадрат со стрелкой вверх).',
        'Выберите «На экран Домой».',
        'Нажмите «Добавить».'
      ]
    );
  });

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
})();
</script>
